services:
  redis:
    image: redis:7-alpine
    container_name: taskq-redis
    ports:
      - "6379:6379"

  
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
  worker:
    build: .
    command: python -m app.workers.worker
    depends_on:
      - redis
    
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0